<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bit Beats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<input type="file" id="loadInput" accept=".json" class="hidden">
<input type="file" id="sampleInput" accept="audio/*" class="hidden">

<!-- ================= HEADER ================= -->
<div id="header">
  <div id="logo">&#9642; BIT BEATS</div>

  <div class="hgroup">
    <button id="playBtn" title="Play / Pause">&#9654;</button>
    <button id="stopBtn" title="Reset playhead to start">&#9198;</button>
    <button id="loopBtn" title="Toggle loop playback">&#8635; Loop</button>
  </div>

  <div class="hgroup">
    <label class="field">BPM<input type="number" id="bpmInput" min="30" max="300" value="120" style="width:56px;"></label>
    <label class="field">Time Sig
      <select id="timeSigSel">
        <option value="4/4" selected>4/4</option>
        <option value="3/4">3/4</option>
        <option value="6/8">6/8</option>
        <option value="2/4">2/4</option>
        <option value="5/4">5/4</option>
      </select>
    </label>
    <label class="field">Note Length
      <select id="noteLenSel">
        <option value="16">Whole</option>
        <option value="8">Half</option>
        <option value="4" selected>Quarter</option>
        <option value="2">Eighth</option>
        <option value="1">Sixteenth</option>
      </select>
    </label>
    <button id="metroBtn" title="Toggle metronome click">&#9834; Metro</button>
  </div>

  <div class="hgroup">
    <label class="field">Key
      <select id="keySel"></select>
    </label>
    <label class="field">Mode
      <select id="modeSel">
        <option>Major</option><option>Minor</option><option>Dorian</option>
        <option>Phrygian</option><option>Lydian</option><option>Mixolydian</option>
        <option>Locrian</option><option>Chromatic</option>
      </select>
    </label>
    <label class="field">Octave Focus
      <select id="octaveSel"></select>
    </label>
  </div>

  <div class="hgroup">
    <button id="addTrackBtnTop">+ Track</button>
    <button id="splitBtn">Split at Playhead</button>
    <button id="deleteTrackBtn">Delete Track</button>
  </div>

  <div class="hgroup" style="margin-left:auto;">
    <button id="undoBtn" title="Undo (Ctrl+Z)">&#8630; Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">&#8631; Redo</button>
    <button id="newBtn">New</button>
    <button id="saveBtn" class="primary">Save</button>
    <button id="loadBtn">Load</button>
  </div>
</div>

<!-- ================= ARRANGE / TRACK OVERVIEW ================= -->
<div id="arrange">
  <div id="trackListCol">
    <div id="trackListHeaderSpacer"></div>
    <div id="trackList"></div>
    <button id="addTrackBtn">+ Add Instrument Track</button>
  </div>
  <div id="timelineCol">
    <div id="timelineInner">
      <div id="playheadOverview"></div>
    </div>
  </div>

  <!-- ================= INSTRUMENT EDITOR ================= -->
  <div id="instEditor">
    <div class="instTopRow">
      <label class="field">Track<span id="instTrackName">—</span></label>
      <button id="advToggleBtn" class="small" title="Advanced track editor (automation)">Advanced&hellip;</button>
      <label class="field">Waveform
        <select id="waveSel">
          <option value="square">Square (8-bit)</option>
          <option value="pulse25">Pulse 25%</option>
          <option value="pulse12">Pulse 12.5%</option>
          <option value="triangle">Triangle</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="sine">Sine</option>
          <option value="noise">Noise (Drum)</option>
          <option value="custom">Custom Sample</option>
        </select>
      </label>
      <button id="uploadSampleBtn" class="small">Upload Sample&hellip;</button>
      <span id="sampleName" style="font-size:10px; color:var(--text-dim); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    </div>

    <div class="instSliders">
      <div class="slidergroup"><span>Volume <span class="val" id="volVal">80</span></span>
        <input type="range" id="volSlider" min="0" max="100" value="80"></div>
      <div class="slidergroup"><span>Attack <span class="val" id="atkVal">5ms</span></span>
        <input type="range" id="atkSlider" min="0" max="300" value="5"></div>
      <div class="slidergroup"><span>Release <span class="val" id="relVal">80ms</span></span>
        <input type="range" id="relSlider" min="5" max="800" value="80"></div>
      <div class="slidergroup"><span>EQ Low <span class="val" id="eqLowVal">0dB</span></span>
        <input type="range" id="eqLowSlider" min="-24" max="24" value="0"></div>
      <div class="slidergroup"><span>EQ Mid <span class="val" id="eqMidVal">0dB</span></span>
        <input type="range" id="eqMidSlider" min="-24" max="24" value="0"></div>
      <div class="slidergroup"><span>EQ High <span class="val" id="eqHighVal">0dB</span></span>
        <input type="range" id="eqHighSlider" min="-24" max="24" value="0"></div>
    </div>

    <div class="instFooter">
      <div class="slidergroup"><span>Reverb <span class="val" id="revVal">0%</span></span>
        <input type="range" id="revSlider" min="0" max="100" value="0"></div>
      <div class="hgroup">
        <button id="transUpBtn" title="Transpose whole track up 1 semitone">Track &#9650; Semi</button>
        <button id="transDownBtn" title="Transpose whole track down 1 semitone">Track &#9660; Semi</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= ADVANCED TRACK EDITOR (AUTOMATION) ================= -->
<div id="advancedEditor" class="hidden">
  <div id="advTabs">
    <button id="advCloseBtn" title="Close advanced editor">&#10005;</button>
    <div id="advTabGrid">
      <button data-param="volume" class="advTabBtn">Volume</button>
      <button data-param="eqLow" class="advTabBtn">EQ Low</button>
      <button data-param="pan" class="advTabBtn">Pan</button>
      <button data-param="eqMid" class="advTabBtn">EQ Mid</button>
      <button data-param="reverb" class="advTabBtn">Reverb</button>
      <button data-param="eqHigh" class="advTabBtn">EQ High</button>
    </div>
  </div>
  <div id="advLaneScroll">
    <div id="advLaneInner">
      <div id="advLaneHeader"></div>
      <canvas id="advLaneCanvas"></canvas>
      <div id="advPointLayer"></div>
    </div>
  </div>
</div>

<div id="rollDivider"></div>

<!-- ================= PIANO ROLL ================= -->
<div id="rollWrap">
  <div id="pianoCol">
    <div id="pianoColInner"></div>
  </div>
  <div id="gridScroll">
    <div id="gridInner">
      <canvas id="gridCanvas"></canvas>
      <div id="noteLayer"></div>
      <div id="selectionBox"></div>
      <div id="playhead"><div id="playheadGrip"></div></div>
    </div>
  </div>
</div>
<div id="rollFooter">
  <span id="footerLeft">Click a cell to add a note &middot; drag to select &middot; Ctrl+C / Ctrl+V to copy &middot; Del to remove &middot; Ctrl+Z / Ctrl+Shift+Z to undo/redo</span>
  <div id="zoomControl"><span>Zoom</span><input type="range" id="zoomSlider" min="5" max="70" value="26"></div>
</div>

<div id="dragTooltip"></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
